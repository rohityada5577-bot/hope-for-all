
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ff5c45">

    <title>Thank You | Hope for All</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff8f5;
            font-family: 'DM Sans', sans-serif;
            padding: 20px;
        }

        .thankyou-card {
            background: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 55px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.07);
        }

        .success-icon {
            width: 85px;
            height: 85px;
            background: #e8f8ed;
            color: #239b56;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 25px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 38px;
            color: #202020;
            margin-bottom: 15px;
        }

        p {
            color: #777;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            background: #ff5c45;
            color: white;
            padding: 15px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #e74732;
            transform: translateY(-3px);
        }

        @media(max-width: 480px) {
            h1 {
                font-size: 30px;
            }

            .thankyou-card {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="thankyou-card">

        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1>Thank You!</h1>

        <p>
            Your enquiry has been submitted successfully.
            We appreciate your interest in Hope for All.
            Our team will contact you soon.
        </p>

        <a href="index.html" class="home-btn">
            <i class="fa-solid fa-house"></i>
            Back to Home
        </a>

    </div>

</body>
</html>
